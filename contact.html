      <ul>

<li><a href="source.html">SOURCE</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div style="max-width: 780px; margin: 0 auto;">
    <h1 class="section-title">Contact Studio</h1>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px;">
      <div class="card">
        <h2 style="font-size: 16px; color: #2B4C6F; margin-bottom: 18px; font-weight: 700;">Customer Care</h2>
        
        <div style="margin-bottom: 15px;">
          <div style="font-size: 11px; text-transform: uppercase; color: #5B7A9C; font-weight: 700;">Email Support</div>
          <div style="font-size: 13px; color: #2B4C6F; font-weight: 600;">info@kur0ma-studio.com</div>
        </div>

        <div style="margin-bottom: 15px;">
          <div style="font-size: 11px; text-transform: uppercase; color: #5B7A9C; font-weight: 700;">Operating Hours</div>
          <div style="font-size: 13px; color: #2B4C6F; font-weight: 600;">Mon – Fri: 09:00 – 17:00</div>
        </div>

        <div>
          <div style="font-size: 11px; text-transform: uppercase; color: #5B7A9C; font-weight: 700;">Instagram</div>
          <div style="font-size: 13px; color: #2B4C6F; font-weight: 600;">@kur0ma_official</div>
        </div>
      </div>

      <div class="card">
        <form action="#" method="get" onsubmit="alert('Message sent successfully.'); return false;">
          <div class="form-group">
            <label for="c-name">Full Name</label>
            <input type="text" id="c-name" class="form-control" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="c-email">Email Address</label>
            <input type="email" id="c-email" class="form-control" placeholder="your.email@example.com" required>
          </div>
          <div class="form-group">
            <label for="c-message">Message</label>
            <textarea id="c-message" class="form-control" rows="4" placeholder="Enter your query..." required></textarea>
          </div>
          <button type="submit" class="btn" style="width: 100%;">Submit</button>
        </form>
      </div>
    </div>
  </div>
</main>
