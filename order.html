<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Form — kur0m@</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo-wrapper">
      <a href="index.html">
        <!-- BISA DIGANTI: Nama file logo kamu -->
        <img src="1000434271.jpg" alt="kur0m@" class="logo-img" onerror="this.src='logo.png';">
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">NEW</a></li>
        <li><a href="products.html">ALL</a></li>
        <li><a href="profile.html">PROFILE</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="order.html" class="active">ORDER FORM</a></li>
<li><a href="source.html">SOURCE</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div style="max-width: 680px; margin: 0 auto;">
    <section class="card">
      <h1 class="section-title">Order Form</h1>

      <form action="#" method="get" onsubmit="alert('Order submitted successfully! Thank you.'); return false;">
        
        <h3 style="font-size: 13px; color: #2B4C6F; margin-bottom: 15px; padding-bottom: 6px; border-bottom: 1px solid rgba(153, 195, 228, 0.4); text-transform: uppercase; letter-spacing: 1px;">Customer Details</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" class="form-control" placeholder="Full name" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="Email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone / WhatsApp</label>
            <input type="tel" id="phone" class="form-control" placeholder="Phone number" required>
          </div>
          <div class="form-group">
            <label for="city">City / State</label>
            <input type="text" id="city" class="form-control" placeholder="City" required>
          </div>
        </div>

        <div class="form-group">
          <label for="address">Shipping Address</label>
          <textarea id="address" class="form-control" rows="3" placeholder="Full delivery address" required></textarea>
        </div>

        <h3 style="font-size: 13px; color: #2B4C6F; margin: 25px 0 15px; padding-bottom: 6px; border-bottom: 1px solid rgba(153, 195, 228, 0.4); text-transform: uppercase; letter-spacing: 1px;">Item Selection</h3>
        
        <div class="form-group">
          <label for="product">Apparel Item</label>
          <select id="product" class="form-control" required>
            <option value="">-- Select Item --</option>
            <option value="baju1">Sailor Top — ¥ 7,800</option>
            <option value="baju2">Studded Asymetrical Dress — ¥ 7,800</option>
            <option value="baju3">Pajama Shirt — ¥ 6,500</option>
            <option value="baju4">Cat Love ♡ Collared Lace SWT — ¥ 8,900</option>
            <option value="baju5">Heisei Girl☆Maji Berry Collaboration Long-Sleeve T-Shirt (Saxophone) — ¥ 7,200</option>
            <option value="baju6">Ribbed T-shirt — ¥ 6,500</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="size">Size</label>
            <select id="size" class="form-control" required>
              <option value="S">Small (S)</option>
              <option value="M" selected>Medium (M)</option>
              <option value="L">Large (L)</option>
              <option value="XL">Extra Large (XL)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" class="form-control" value="1" min="1" max="10" required>
          </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 15px; padding: 14px;">Confirm Order</button>
      </form>
    </section>
  </div>
</main>

<footer>
  <p>&copy; 2026 kur0m@ studio. All rights reserved.</p>
</footer>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const productParam = urlParams.get('product');
    if (productParam) {
      const selectElem = document.getElementById('product');
      if (selectElem) {
        selectElem.value = productParam;
      }
    }
  });
</script>

</body>
</html>
